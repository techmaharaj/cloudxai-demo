#!/usr/bin/env bash
# ============================================================
# GrafanaCon Demo - Kind Cluster Config
# Creates a kind cluster with audit logging enabled
# ============================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: grafanacon-demo
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        audit-log-path: /var/log/kubernetes/audit.log
        audit-policy-file: /etc/kubernetes/audit-policy.yaml
        audit-log-maxage: "1"
        audit-log-maxbackup: "1"
        audit-log-maxsize: "100"
      extraVolumes:
      - name: audit-policy
        hostPath: /etc/kubernetes/audit-policy.yaml
        mountPath: /etc/kubernetes/audit-policy.yaml
        readOnly: true
        pathType: File
      - name: audit-log
        hostPath: /var/log/kubernetes
        mountPath: /var/log/kubernetes
        pathType: DirectoryOrCreate
  extraMounts:
  - hostPath: /tmp/grafanacon-audit-policy.yaml
    containerPath: /etc/kubernetes/audit-policy.yaml
    readOnly: true
  - hostPath: /tmp/grafanacon-audit-logs
    containerPath: /var/log/kubernetes
