apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: grafanacon
  labels:
    app: demo-app
    managed-by: ai-agent
  annotations:
    # These annotations will be updated by the agent on each scaling action
    accountability.ai/last-scaled-by: "unset"
    accountability.ai/last-trace-id: "unset"
    accountability.ai/last-reason: "unset"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
